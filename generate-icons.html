<!DOCTYPE html>
<html>
<body>
<script>
function generateIcon(size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');

  // Background
  const r = size * 0.18;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fillStyle = '#1a1a2e';
  ctx.fill();

  // Roblox-style inner square
  const pad = size * 0.22;
  ctx.fillStyle = '#5b6eea';
  ctx.fillRect(pad, pad, size - pad * 2, size - pad * 2);

  // Inner hole
  const hole = size * 0.15;
  const hx = (size - hole) / 2;
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(hx, hx, hole, hole);

  // Switch arrows
  const ax = size * 0.7;
  const ay = size * 0.3;
  const as = size * 0.12;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(ax, ay - as);
  ctx.lineTo(ax + as, ay);
  ctx.lineTo(ax - as, ay);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(ax, ay + as * 2.5);
  ctx.lineTo(ax + as, ay + as * 1.5);
  ctx.lineTo(ax - as, ay + as * 1.5);
  ctx.fill();

  return c.toDataURL('image/png');
}

[16, 48, 128].forEach(size => {
  const link = document.createElement('a');
  link.download = `icon${size}.png`;
  link.href = generateIcon(size);
  link.textContent = `Download ${size}x${size}`;
  link.style.display = 'block';
  link.style.margin = '10px';
  document.body.appendChild(link);

  const img = document.createElement('img');
  img.src = link.href;
  img.style.margin = '10px';
  img.style.imageRendering = 'pixelated';
  img.width = 64;
  document.body.appendChild(img);
});
</script>
</body>
</html>
