<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Account Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <div class="gradient-bar"></div>

    <header class="header">
      <div class="brand">
        <div class="logo-wrap">
          <svg class="logo" viewBox="0 0 24 24" width="20" height="20" fill="none">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <g transform="rotate(-15 12 12)">
              <rect x="3" y="3" width="18" height="18" rx="3" fill="url(#logoGrad)"/>
              <rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="#08080f"/>
            </g>
          </svg>
        </div>
        <h1>Accounts</h1>
      </div>
      <div class="header-actions">
        <button id="logoutBtn" class="btn-logout" title="Sign out of Roblox (keeps account saved)" disabled>
          <svg viewBox="0 0 20 20" width="15" height="15" fill="currentColor">
            <path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 015.25 2h5.5A2.25 2.25 0 0113 4.25v2a.75.75 0 01-1.5 0v-2a.75.75 0 00-.75-.75h-5.5a.75.75 0 00-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 00.75-.75v-2a.75.75 0 011.5 0v2A2.25 2.25 0 0110.75 18h-5.5A2.25 2.25 0 013 15.75V4.25z" clip-rule="evenodd"/>
            <path fill-rule="evenodd" d="M6 10a.75.75 0 01.75-.75h9.546l-1.048-1.527a.75.75 0 111.244-.84l1.874 2.75a.75.75 0 010 .84l-1.874 2.75a.75.75 0 11-1.244-.84L16.296 10.75H6.75A.75.75 0 016 10z" clip-rule="evenodd"/>
          </svg>
          <span>Sign Out</span>
        </button>
        <button id="addBtn" class="btn-add" title="Add current logged-in account">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
            <path d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"/>
          </svg>
          <span>Add</span>
        </button>
      </div>
    </header>

    <!-- Account List -->
    <div id="accountList" class="account-list"></div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">
        <svg viewBox="0 0 64 64" width="56" height="56" fill="none">
          <defs>
            <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.5"/>
              <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="24" r="10" stroke="url(#emptyGrad)" stroke-width="1.5"/>
          <path d="M12 52c0-11.046 8.954-20 20-20s20 8.954 20 20" stroke="url(#emptyGrad)" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="46" cy="40" r="9" fill="#08080f" stroke="url(#emptyGrad)" stroke-width="1.5"/>
          <path d="M46 36v8M42 40h8" stroke="url(#emptyGrad)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="empty-title">No accounts yet</p>
      <p class="empty-desc">Log into Roblox, then click <strong>Add</strong> to save it</p>
    </div>

    <!-- Status Toast -->
    <div id="toast" class="toast hidden">
      <div class="toast-icon"></div>
      <span class="toast-msg"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
